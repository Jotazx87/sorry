<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desculpa, Duda 🥺</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Plus Jakarta Sans', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Gradient & Glow Background */
        body {
            background: radial-gradient(circle at center, #1a1528 0%, #0d0b14 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Glassmorphism Card Styling */
        .glass-card {
            background: rgba(22, 18, 36, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5),
                        0 0 30px rgba(168, 85, 247, 0.15);
        }

        /* Falling/Floating Emoji Styling */
        .floating-emoji {
            position: absolute;
            font-size: 2rem;
            cursor: pointer;
            z-index: 10;
            transition: transform 0.2s ease;
            will-change: transform, top, left;
            animation: floatMotion linear infinite;
        }

        .floating-emoji:hover {
            transform: scale(1.3);
        }

        /* Particle effect for emoji burst */
        .particle {
            position: absolute;
            pointer-events: none;
            border-radius: 50%;
            animation: popParticle 0.6s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
            z-index: 20;
        }

        @keyframes popParticle {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--dx), var(--dy)) scale(0);
            }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(168, 85, 247, 0.3);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(168, 85, 247, 0.6);
        }

        /* Glow animation for buttons */
        .glow-btn {
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
            transition: all 0.3s ease;
        }
        .glow-btn:hover {
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.7);
            transform: translateY(-2px);
        }

        /* Cursor blink for typing effect */
        .cursor-blink {
            display: inline-block;
            width: 3px;
            height: 1.1em;
            background-color: #a855f7;
            margin-left: 2px;
            vertical-align: middle;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 sm:p-6 md:p-10 relative overflow-hidden text-gray-200">

    <div id="emoji-container" class="fixed inset-0 pointer-events-none overflow-hidden z-0"></div>

    <main class="relative z-20 w-full max-w-2xl my-auto">
        <div class="glass-card rounded-3xl p-6 sm:p-8 md:p-10 relative overflow-hidden transition-all duration-500">
            
            <!-- Card Header -->
            <div class="flex items-center justify-between border-b border-white/10 pb-4 mb-6">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-full bg-purple-900/50 border border-purple-500/30 flex items-center justify-center text-purple-300 shadow-inner">
                        <i class="fa-solid font-bold text-lg">💜</i>
                    </div>
                    <div>
                        <h1 class="text-lg font-bold text-white tracking-wide">Para: Duda</h1>
                        <p class="text-xs text-purple-300/70">Uma mensagem especial de desculpas</p>
                    </div>
                </div>
                <div class="flex items-center space-x-2">
                    <span class="inline-block w-2.5 h-2.5 rounded-full bg-purple-500 animate-pulse"></span>
                    <span id="pop-counter" class="text-xs text-purple-300 font-medium bg-purple-950/60 px-2.5 py-1 rounded-full border border-purple-800/40">
                        Clique nos emojis: <span id="pop-count" class="font-bold text-purple-200">0</span>
                    </span>
                </div>
            </div>

            <!-- Message Container -->
            <div class="min-h-[220px] text-gray-200 text-sm sm:text-base leading-relaxed tracking-wide font-normal whitespace-pre-wrap selection:bg-purple-500 selection:text-white">
                <p id="typed-text" class="inline"></p><span id="cursor" class="cursor-blink"></span>
            </div>

            <div class="mt-8 pt-6 border-t border-white/10 flex flex-col sm:flex-row items-center justify-between gap-4">
                <button id="restart-btn" onclick="restartTyping()" class="w-full sm:w-auto px-5 py-2.5 rounded-xl bg-white/5 hover:bg-white/10 text-gray-300 hover:text-white border border-white/10 text-xs font-medium transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-rotate-right"></i> Ler mensagem de novo
                </button>

                <div class="flex gap-3 w-full sm:w-auto">
                    <button onclick="triggerHeartBurst()" class="flex-1 sm:flex-none glow-btn px-6 py-2.5 rounded-xl bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-medium text-xs sm:text-sm flex items-center justify-center gap-2 shadow-lg">
                        <i class="fa-solid fa-heart text-pink-300"></i> Te perdoo!
                    </button>
                </div>
            </div>

            <!-- Response Feedback Overlay (hidden by default) -->
            <div id="forgive-modal" class="hidden absolute inset-0 bg-slate-950/90 backdrop-blur-md rounded-3xl flex flex-col items-center justify-center p-6 text-center z-30 transition-all duration-300">
                <div class="text-5xl mb-4 animate-bounce">🥺✨💖</div>
                <h2 class="text-2xl font-bold text-white mb-2">Muito obrigado, Duda!</h2>
                <p class="text-purple-200/80 text-sm max-w-md mb-6">Prometo ser um duo bem melhor, uma amiga/duo/dev incrível e valorizar sempre você! Você é a melhor do mundo! 🎮👑</p>
                <button onclick="closeModal()" class="px-6 py-2.5 rounded-xl bg-purple-600 hover:bg-purple-500 text-white font-medium text-xs">
                    Fechar
                </button>
            </div>

        </div>
    </main>

    <script>
        // Full Apology Message
        const fullText = `duda, desculpa, eu tava resolvendo aql problema q mostrei e cabou q fui grosso cntg e tal, sei q fui um duo ruim me desculpa me senti mal por o q fiz eu sei que fui uma pessima pessoa duda, te irritei como eu fiz um tempo atras e nao gosto disso me perdoa por tudo que falei... sei q vc sempre ta aqui cmg me responde, nossa forma de conversar eu gosto kkkkk inclusive agora eu falo assimmmm (com varios M) por causa da forma q a gente fala eu sei fui ingrato por tudo q vc faz por mim...

espero que ainda queira ser minha duo, minha amiga, minha dev, minha melhor do mundo`;

        let typeIndex = 0;
        let isTyping = false;
        let typingTimeout;
        let popCount = 0;

        const emojiList = ['🥺', '😭', '💔', '🌧️', '😔', '😢', '🥺', '😭'];

        // Typing Effect Function
        function typeWriter() {
            const typedTextElement = document.getElementById("typed-text");
            const cursorElement = document.getElementById("cursor");

            if (typeIndex < fullText.length) {
                isTyping = true;
                typedTextElement.textContent += fullText.charAt(typeIndex);
                typeIndex++;

                // Speed variation for natural reading feel
                let char = fullText.charAt(typeIndex - 1);
                let speed = 35;
                if (char === '.' || char === '\n') speed = 350;
                else if (char === ',') speed = 150;

                typingTimeout = setTimeout(typeWriter, speed);
            } else {
                isTyping = false;
                cursorElement.style.display = 'none';
            }
        }

        function restartTyping() {
            clearTimeout(typingTimeout);
            document.getElementById("typed-text").textContent = "";
            document.getElementById("cursor").style.display = "inline-block";
            typeIndex = 0;
            typeWriter();
        }

        // --- Emoji Spawner Logic ---
        function createFloatingEmoji() {
            const container = document.getElementById("emoji-container");
            const emojiEl = document.createElement("div");
            
            emojiEl.className = "floating-emoji pointer-events-auto";
            emojiEl.textContent = emojiList[Math.floor(Math.random() * emojiList.length)];
            
            // Random direction: going UP or going DOWN
            const isGoingUp = Math.random() > 0.5;
            const startX = Math.random() * 90 + 5; // 5% to 95% width
            
            emojiEl.style.left = `${startX}vw`;
            
            if (isGoingUp) {
                emojiEl.style.top = '105vh';
            } else {
                emojiEl.style.top = '-10vh';
            }

            const duration = Math.random() * 8 + 7; // 7s to 15s speed
            const size = Math.random() * 1.2 + 1.5; // 1.5rem to 2.7rem
            emojiEl.style.fontSize = `${size}rem`;
            emojiEl.style.opacity = (Math.random() * 0.5 + 0.4).toString();

            // Animate using JS web animations API for precise smooth control
            const keyframes = isGoingUp ? [
                { transform: `translate(0, 0) rotate(0deg)` },
                { transform: `translate(${Math.random() * 100 - 50}px, -115vh) rotate(${Math.random() * 360}deg)` }
            ] : [
                { transform: `translate(0, 0) rotate(0deg)` },
                { transform: `translate(${Math.random() * 100 - 50}px, 115vh) rotate(${Math.random() * 360}deg)` }
            ];

            const animation = emojiEl.animate(keyframes, {
                duration: duration * 1000,
                easing: 'linear',
                fill: 'forwards'
            });

            // Handle Burst/Pop click or touch event
            const triggerBurst = (e) => {
                e.preventDefault();
                e.stopPropagation();

                const rect = emojiEl.getBoundingClientRect();
                const x = rect.left + rect.width / 2;
                const y = rect.top + rect.height / 2;

                createBurstParticles(x, y);
                playPopSound();

                popCount++;
                document.getElementById('pop-count').textContent = popCount;

                animation.cancel();
                emojiEl.remove();
            };

            emojiEl.addEventListener('click', triggerBurst);
            emojiEl.addEventListener('touchstart', triggerBurst, { passive: false });

            animation.onfinish = () => {
                emojiEl.remove();
            };

            container.appendChild(emojiEl);
        }

        // Particle Burst Effect
        function createBurstParticles(x, y) {
            const colors = ['#a855f7', '#c084fc', '#e879f9', '#f472b6', '#ffffff'];
            const particleCount = 14;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                
                const size = Math.random() * 8 + 4;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                particle.style.left = `${x}px`;
                particle.style.top = `${y}px`;

                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 70 + 30;
                const dx = Math.cos(angle) * distance;
                const dy = Math.sin(angle) * distance;

                particle.style.setProperty('--dx', `${dx}px`);
                particle.style.setProperty('--dy', `${dy}px`);

                document.body.appendChild(particle);

                setTimeout(() => particle.remove(), 600);
            }
        }

        // Audio synthesis for pop sound effect (No external file dependencies)
        function playPopSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.08);

                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start();
                osc.stop(ctx.currentTime + 0.08);
            } catch (e) {
                // Audio context not allowed until user interaction (safely ignore)
            }
        }

        // Forgive Heart Explosion
        function triggerHeartBurst() {
            const modal = document.getElementById('forgive-modal');
            modal.classList.remove('hidden');

            // Burst hearts across screen
            for (let i = 0; i < 30; i++) {
                setTimeout(() => {
                    const x = Math.random() * window.innerWidth;
                    const y = Math.random() * window.innerHeight;
                    createBurstParticles(x, y);
                }, i * 35);
            }
        }

        function closeModal() {
            document.getElementById('forgive-modal').classList.add('hidden');
        }

        window.onload = function () {
            // Start typing effect
            typeWriter();

            // Continuously spawn floating emojis
            setInterval(createFloatingEmoji, 800);

            // Initial batch of emojis for immediate visuals
            for (let i = 0; i < 8; i++) {
                setTimeout(createFloatingEmoji, i * 200);
            }
        };
    </script>
</body>
</html>
